<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="enregistrer_doc.css">
</head>
<body>
    <main>
        <div class="left_arrow_container">
           <a href=""> <div class="back_button">
                <img src="static/icons/Flêche_gauche.png" alt="">
            </div>
        </a>
        </div>

        <div class="page_name">
            <h2>ENREGISTRER DOCUMENTAIRE</h2>
        </div>

        <div class="form_container">
            <form action="" method="post">

              <input type="text" placeholder="Code" name="code">
              <input type="text" placeholder="Titre" name="titre">
              <input type="date" placeholder="Date de sortie" name="datedesortie">
              
              <div class="cover_upload">
                <label>
                 <h2>Cover</h2>
                  <img src="static/icons/Upload_icon.png" alt="">
                  <input type="file" id="imageUpload" name="image" accept="image/*">
                </label>
              </div>

              <div class="select_list">
                <select name="realisateur" id="">
                  <option value="" disabled selected hidden>Réalisateur</option>
                  <option value="">Réalisateur 1</option>
                  <option value="">Réalisateur 2</option>
                  <option value="">Réalisateur 3</option>
                  <option value="">Réalisateur 4</option>
                </select>
              </div>

              <div class="select_list">
                <select name="porducteur" id="">
                  <option value="" disabled selected hidden>Producteur</option>
                  <option value="">Producteur 1</option>
                  <option value="">Producteur 2</option>
                  <option value="">Producteur 3</option>
                  <option value="">Producteur 4</option>
                </select>
              </div>

              <textarea id="message" name="description" rows="10" cols="50" placeholder="Description"></textarea>
              
                
                <div class="button_container">
                    <button type="submit">
                        <h2>Enregistrer</h2>
                        <img src="static/icons/Play_icon.png" alt="">
                    </button>     
                </div>
                
                
                
            </form>
        </div>
        

    </main>
</body>
</html>
